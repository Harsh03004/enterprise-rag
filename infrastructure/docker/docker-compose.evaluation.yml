# Resource-limited evaluation for local machines.
#
# Use through scripts/run_evaluation.sh, which also pauses services the
# evaluation does not need and checks free memory first.
#
# The LLM runs in `ollama-cpu`: the host's Ollama binary and downloaded models,
# inside a container that has no GPU devices at all, so generation can never
# compete with the desktop for a GPU. CPU and memory are capped and swap is
# disabled, so an overload stops the container instead of freezing the host;
# --resume continues from the last completed case.
services:
  ollama-cpu:
    image: enterprise-rag-backend:latest
    restart: "no"
    entrypoint: ["/usr/local/bin/ollama", "serve"]
    command: []
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 15m
      OLLAMA_NOPRUNE: "1"
      HOME: /tmp
    volumes:
      - /usr/local/bin/ollama:/usr/local/bin/ollama:ro
      - /usr/local/lib/ollama:/usr/local/lib/ollama:ro
      - ${OLLAMA_MODELS_DIR:-/var/lib/ollama/.ollama/models}:/models:ro
    # Threads 0-3 stay free for the desktop.
    cpuset: ${OLLAMA_CPUSET:-4-15}
    mem_limit: ${OLLAMA_MEMORY:-7g}
    memswap_limit: ${OLLAMA_MEMORY:-7g}
    cpus: "${OLLAMA_CPUS:-6}"
    healthcheck:
      test: ["CMD", "/usr/local/bin/ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 24

  evaluation:
    extends:
      file: docker-compose.yml
      service: backend
    image: enterprise-rag-backend:latest
    restart: "no"
    healthcheck:
      disable: true
    environment:
      OLLAMA_BASE_URL: http://ollama-cpu:11434/v1
      # Keep torch/tokenizers from spawning a thread per CPU core.
      OMP_NUM_THREADS: ${EVAL_THREADS:-2}
      MKL_NUM_THREADS: ${EVAL_THREADS:-2}
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - ../../backend/evaluation_runs:/app/evaluation_runs
    cpuset: ${OLLAMA_CPUSET:-4-15}
    mem_limit: ${EVAL_MEMORY:-3g}
    memswap_limit: ${EVAL_MEMORY:-3g}
    cpus: "${EVAL_CPUS:-2}"
    command: ["python", "-m", "app.evaluation.runner"]
